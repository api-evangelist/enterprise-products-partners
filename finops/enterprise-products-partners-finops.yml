    unit: barrel
    aggregation: sum
    dimensions:
      - pipeline
      - shipper
      - product
  - name: storage_capacity
    unit: barrel-month
    aggregation: sum
    dimensions:
      - terminal
      - shipper
  - name: contract_fee
    unit: month
    aggregation: sum
    dimensions:
      - contract
principles:
  - name: Visibility
    description: Visibility into pipeline usage and charges flows through monthly transportation/storage
      invoices and shipper portals rather than an API-billing dashboard.
  - name: Allocation
    description: Allocate charges by shipper contract, pipeline segment, terminal, and product category
      (crude/NGL/natural gas/refined).
  - name: Optimization
    description: Optimization is achieved through nomination accuracy, capacity contract structuring, and
      multi-product bundling; there are no API-level discount programs.
  - name: Accountability
    description: The shipper's commercial/operations team owns spend and reconciles against the executed
      service agreement and FERC-filed tariff.
