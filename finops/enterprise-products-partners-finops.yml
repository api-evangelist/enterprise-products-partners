description: FOCUS-aligned FinOps placeholder for Enterprise Products Partners. The economic surface here
  is pipeline transportation, NGL fractionation, and storage services governed by FERC-filed tariffs and
  bilateral service agreements rather than per-API-call billing. FinOps practice attaches to the underlying
  logistics service, not to API metering.
notes: No public usage/billing API was located. The relevant cost lines are pipeline tariff charges, NGL
  processing fees, and contracted storage; reconcile against the executed Transportation/Service Agreement.
