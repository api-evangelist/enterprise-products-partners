naftiko: 1.0.0-alpha2
info:
  label: Enterprise Products Partners Pipeline Operations API
  description: Enterprise Products Partners provides midstream energy services including pipeline operations, natural gas
    processing, and energy logistics across North America.
  tags:
  - Enterprise
  - Products
  - Partners
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: enterprise-products-partners
    baseUri: https://api.enterpriseproducts.com
    description: Enterprise Products Partners Pipeline Operations API HTTP API.
    resources:
    - name: pipelines
      path: /pipelines
      operations:
      - name: getpipelines
        method: GET
        description: Get Pipelines
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: pipelines-pipelineid
      path: /pipelines/{pipelineId}
      operations:
      - name: getpipelinebyid
        method: GET
        description: Get Pipeline by ID
        inputParameters:
        - name: pipelineId
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: capacity
      path: /capacity
      operations:
      - name: getcapacity
        method: GET
        description: Get Capacity Information
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: enterprise-products-partners-rest
    description: REST adapter for Enterprise Products Partners Pipeline Operations API.
    resources:
    - path: /pipelines
      name: getpipelines
      operations:
      - method: GET
        name: getpipelines
        description: Get Pipelines
        call: enterprise-products-partners.getpipelines
        outputParameters:
        - type: object
          mapping: $.
    - path: /pipelines/{pipelineId}
      name: getpipelinebyid
      operations:
      - method: GET
        name: getpipelinebyid
        description: Get Pipeline by ID
        call: enterprise-products-partners.getpipelinebyid
        with:
          pipelineId: rest.pipelineId
        outputParameters:
        - type: object
          mapping: $.
    - path: /capacity
      name: getcapacity
      operations:
      - method: GET
        name: getcapacity
        description: Get Capacity Information
        call: enterprise-products-partners.getcapacity
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: enterprise-products-partners-mcp
    transport: http
    description: MCP adapter for Enterprise Products Partners Pipeline Operations API for AI agent use.
    tools:
    - name: getpipelines
      description: Get Pipelines
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: enterprise-products-partners.getpipelines
      outputParameters:
      - type: object
        mapping: $.
    - name: getpipelinebyid
      description: Get Pipeline by ID
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: enterprise-products-partners.getpipelinebyid
      with:
        pipelineId: tools.pipelineId
      inputParameters:
      - name: pipelineId
        type: string
        description: pipelineId
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: getcapacity
      description: Get Capacity Information
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: enterprise-products-partners.getcapacity
      outputParameters:
      - type: object
        mapping: $.
